<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>BuddyBridge</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-text"><h1>BuddyBridge</h1><p class="tagline">让 WorkBuddy 连接 OpenCode</p></div>
    </div>
    <div class="service"><span id="service-dot" class="dot"></span><span id="service-text">正在启动隔离模型服务</span><button id="restart" hidden>重试</button></div>
  </header>
  <section class="statsbar">
    <div class="metrics">
      <div class="stat"><b id="discovered">0</b><span>已发现</span></div>
      <div class="stat ok"><b id="available">0</b><span>可用</span></div>
      <div class="stat"><b id="pending">0</b><span>待检测</span></div>
    </div>
    <div class="actions">
      <button id="update-runtime">更新 OpenCode</button>
      <button id="refresh">读取免费模型</button>
      <button id="probe">检测全部</button>
      <button id="import" class="primary">导入 WorkBuddy</button>
    </div>
  </section>
  <div id="feedback" role="status" hidden></div>
  <section class="listhead"><h2>免费模型</h2><p id="sync">启动时仅导入有效缓存；检测后需手动导入 WorkBuddy</p></section>
  <section id="models" aria-label="模型列表"></section>
  <p class="note">启动时不全量检测；成功结果缓存 8 小时。手动检测会使用免费额度，不代表完整工具流程已验证。耗时为完整请求用时，非首字延迟。不可用模型仅在本窗口保留，不供 WorkBuddy 使用；剩余额度暂不可查询。</p>
  <footer class="bar">
    <div class="foot-left">
      <label class="toggle-label">使用系统代理 <input id="proxy" type="checkbox" role="switch"></label>
      <label class="pref-label" title="填入 Cloudflare 优选 IP（逗号分隔），直连时优先经它访问网关；留空使用自动链路">优选IP <input id="gateway-ips" type="text" placeholder="留空自动" spellcheck="false" autocomplete="off"></label>
      <label class="pref-label" title="检测结果的有效缓存时长；延长时间可减少重复检测">缓存 <select id="cache-hours"><option value="8">8小时</option><option value="24">24小时</option><option value="72">72小时</option></select></label>
    </div>
    <div class="foot-right">
      <button id="contact-card" class="support" title="点击查看二维码名片">▣ 技术支持 @HindleyCheng</button>
      <span id="app-version">BuddyBridge</span>
      <button id="check-update">检查更新</button>
    </div>
  </footer>
</main>
<div id="card-overlay" hidden><img src="contact-card.jpg" alt="技术支持 @HindleyCheng 的微信二维码名片（放大）"><p>技术支持 @HindleyCheng · 扫码添加微信</p></div>
<script src="activity.cjs"></script>
<script src="renderer.js"></script>
</body></html>
